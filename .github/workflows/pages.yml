name: Deploy BizTrust Guide to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate continuity and static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate continuity contracts
        run: python3 scripts/validate_continuity.py

      - name: Validate JavaScript syntax
        run: node --check script.js

      - name: Verify required publishing assets
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s assets/unitrust-horizontal.png
          test -s assets/unitrust-icon.png

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Stage immutable site artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/assets
          cp index.html styles.css script.js .nojekyll _site/
          cp assets/unitrust-horizontal.png assets/unitrust-vertical.png assets/unitrust-icon.png _site/assets/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy approved artifact
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

