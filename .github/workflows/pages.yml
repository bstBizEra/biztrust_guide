name: Deploy BizTrust Guide to GitHub Pages

on:
  push:
    branches: [main]
  # No base-branch filter: a pull request into ANY branch must be validated.
  # With `branches: [main]` a stacked pull request (base = a feature branch)
  # produced no workflow run at all, and mergeable_state read "clean" whether
  # CI had passed or had never run. Deploy steps stay gated on
  # `github.event_name != 'pull_request'`, so this widens validation only.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deployments must serialise, so every push shares one group. Validation runs
  # must NOT: a single shared group meant a queued pull-request run was cancelled
  # (documented: "any existing pending job or workflow in the same concurrency group
  # will be canceled and the new queued job or workflow will take its place" -
  # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs).
  # Pull-request runs are grouped per ref, so a later push to the SAME pull request
  # still replaces its queued run; only runs for different pull requests are independent.
  # and replaced by the next arrival, which is the same "CI never ran but nothing
  # says so" failure the unfiltered pull_request trigger above was added to fix.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate continuity and static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Runs BEFORE the validator is trusted below. The validator is the
      # instrument every other gate is read through; an instrument that has
      # never been observed to fail is indistinguishable from one that passed.
      - name: Prove the validator fails closed
        run: python3 -m unittest discover -s tests -v

      - name: Validate continuity contracts
        run: python3 scripts/validate_continuity.py

      - name: Validate JavaScript syntax
        run: node --check script.js

      - name: Verify required publishing assets
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s landing/showcase.css
          test -s assets/biztrust-symbol.svg

      - name: Stage immutable site artifact
        run: |
          mkdir -p _site/assets
          cp styles.css script.js .nojekyll _site/
          mkdir -p _site/landing
          cp landing/showcase.css _site/landing/
          git ls-files 'assets/*' | while read -r asset; do
            mkdir -p "_site/$(dirname "$asset")"
            cp "$asset" "_site/$asset"
          done
          git ls-files '*.html' | while read -r page; do
            mkdir -p "_site/$(dirname "$page")"
            cp "$page" "_site/$page"
          done

      # AFTER staging and BEFORE the two verification steps below, on purpose.
      #
      # The staging step above already copied the tracked `control/index.html` - a placeholder that
      # says it has not been generated - to `_site/control/index.html`. This OVERWRITES that one
      # file in place with the same page carrying the records projected into it. The file is
      # replaced, never removed, so the "every tracked page reached the artifact" check below still
      # finds it and the page count it walks is unchanged. Nothing generated is committed: the
      # tracked file stays a placeholder, and tests/test_control_page.py holds it to that.
      #
      # It reads `badf/`, runs `scripts/validate_continuity.py` and calls `git` against this
      # checkout. It makes NO network call and reads no tracker (#311). The checkout above is
      # shallow, so the reconciliation will read UNKNOWN here; the page says in its own prose that
      # this is the expected reading on a published copy and not a defect.
      - name: Project the records into the staged control page
        run: python3 scripts/build_control_page.py --out _site/control/index.html

      - name: Verify every tracked asset reached the artifact
        run: |
          status=0
          for asset in $(git ls-files 'assets/*'); do
            if [ ! -f "_site/$asset" ]; then
              echo "MISSING FROM ARTIFACT: $asset"
              status=1
            fi
          done
          echo "--- staged assets ---"
          find _site/assets -type f | sort
          exit $status

      - name: Verify every tracked page reached the artifact
        run: |
          status=0
          for page in $(git ls-files '*.html'); do
            if [ ! -f "_site/$page" ]; then
              echo "MISSING FROM ARTIFACT: $page"
              status=1
            fi
          done
          echo "--- staged pages ---"
          find _site -name '*.html' | sort
          exit $status

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy approved artifact
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

