name: Deploy BizTrust Guide to GitHub Pages

on:
  push:
    branches: [main]
  # No base-branch filter: a pull request into ANY branch must be validated.
  # With `branches: [main]` a stacked pull request (base = a feature branch)
  # produced no workflow run at all, and mergeable_state read "clean" whether
  # CI had passed or had never run. Deploy steps stay gated on
  # `github.event_name != 'pull_request'`, so this widens validation only.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate continuity and static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate continuity contracts
        run: python3 scripts/validate_continuity.py

      - name: Validate JavaScript syntax
        run: node --check script.js

      - name: Verify required publishing assets
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s assets/unitrust-horizontal.png
          test -s assets/unitrust-icon.png

      - name: Stage immutable site artifact
        run: |
          mkdir -p _site/assets
          cp styles.css script.js .nojekyll _site/
          cp assets/unitrust-horizontal.png assets/unitrust-vertical.png assets/unitrust-icon.png _site/assets/
          git ls-files '*.html' | while read -r page; do
            mkdir -p "_site/$(dirname "$page")"
            cp "$page" "_site/$page"
          done

      - name: Verify every tracked page reached the artifact
        run: |
          status=0
          for page in $(git ls-files '*.html'); do
            if [ ! -f "_site/$page" ]; then
              echo "MISSING FROM ARTIFACT: $page"
              status=1
            fi
          done
          echo "--- staged pages ---"
          find _site -name '*.html' | sort
          exit $status

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy approved artifact
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

